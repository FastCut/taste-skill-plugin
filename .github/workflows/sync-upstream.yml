name: Sync from Leonxlnx upstream repositories

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream skill
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Leonxlnx/taste-skill.git /tmp/upstream
          git -C /tmp/upstream sparse-checkout set --no-cone /skills/taste-skill/ /.claude-plugin/marketplace.json /LICENSE

      - name: Update taste-skill plugin
        run: bash scripts/sync-upstream.sh /tmp/upstream

      - name: Fetch upstream imagegen-skills
        run: git clone --depth 1 https://github.com/Leonxlnx/imagegen-skills.git /tmp/upstream-imagegen

      - name: Update imagegen-skills plugin
        run: bash scripts/sync-imagegen.sh /tmp/upstream-imagegen

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes"
            exit 0
          fi
          git commit -m "Sync from upstream (taste-skill@$(cut -c1-7 .upstream-commit), imagegen-skills@$(cut -c1-7 .upstream-commit-imagegen))"
          git push
